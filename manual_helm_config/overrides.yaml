global:
   enabled: true
   tlsDisable: false
injector:
   enabled: true
server:
   image:
    repository: hashicorp/vault-enterprise
    tag: 1.21.1-ent # https://hub.docker.com/r/hashicorp/vault-enterprise/tags
   enterpriseLicense:
    secretName: "vault-ent-license"
    secretKey: "license"
   extraEnvironmentVars:
      VAULT_CACERT: /vault/userconfig/vault-ha-tls/vault.ca
      VAULT_TLSCERT: /vault/userconfig/vault-ha-tls/vault.crt
      VAULT_TLSKEY: /vault/userconfig/vault-ha-tls/vault.key
   volumes:
      - name: userconfig-vault-ha-tls
        secret:
         defaultMode: 420
         secretName: vault-ha-tls
   volumeMounts:
      - mountPath: /vault/userconfig/vault-ha-tls
        name: userconfig-vault-ha-tls
        readOnly: true
   standalone:
      enabled: false
   affinity: ""
   ha:
      enabled: true
      replicas: 3
      raft:
         enabled: true
         setNodeId: true
         config: |
            ui = true
            listener "tcp" {
               tls_disable = 0
               address = "[::]:8200"
               cluster_address = "[::]:8201"
               tls_cert_file = "/vault/userconfig/vault-ha-tls/vault.crt"
               tls_key_file  = "/vault/userconfig/vault-ha-tls/vault.key"
               tls_client_ca_file = "/vault/userconfig/vault-ha-tls/vault.ca"
            }
            storage "raft" {
               path = "/vault/data"
               retry_join { 
                leader_api_addr = "https://vault-0.vault-internal:8200"
                leader_ca_cert_file = "/vault/userconfig/vault-ha-tls/vault.ca"
                leader_client_cert_file = "/vault/userconfig/vault-ha-tls/vault.crt"
                leader_client_key_file = "/vault/userconfig/vault-ha-tls/vault.key"
               }
               retry_join { 
                leader_api_addr = "https://vault-1.vault-internal:8200"
                leader_ca_cert_file = "/vault/userconfig/vault-ha-tls/vault.ca"
                leader_client_cert_file = "/vault/userconfig/vault-ha-tls/vault.crt"
                leader_client_key_file = "/vault/userconfig/vault-ha-tls/vault.key"
               }
               retry_join { 
                leader_api_addr = "https://vault-2.vault-internal:8200"
                leader_ca_cert_file = "/vault/userconfig/vault-ha-tls/vault.ca"
                leader_client_cert_file = "/vault/userconfig/vault-ha-tls/vault.crt"
                leader_client_key_file = "/vault/userconfig/vault-ha-tls/vault.key"
               }
               retry_join { 
                leader_api_addr = "https://vault-3.vault-internal:8200"
                leader_ca_cert_file = "/vault/userconfig/vault-ha-tls/vault.ca"
                leader_client_cert_file = "/vault/userconfig/vault-ha-tls/vault.crt"
                leader_client_key_file = "/vault/userconfig/vault-ha-tls/vault.key"
               }
               retry_join { 
                leader_api_addr = "https://vault-4.vault-internal:8200"
                leader_ca_cert_file = "/vault/userconfig/vault-ha-tls/vault.ca"
                leader_client_cert_file = "/vault/userconfig/vault-ha-tls/vault.crt"
                leader_client_key_file = "/vault/userconfig/vault-ha-tls/vault.key"
               }
               retry_join { 
                leader_api_addr = "https://vault-5.vault-internal:8200"
                leader_ca_cert_file = "/vault/userconfig/vault-ha-tls/vault.ca"
                leader_client_cert_file = "/vault/userconfig/vault-ha-tls/vault.crt"
                leader_client_key_file = "/vault/userconfig/vault-ha-tls/vault.key"
               }
               retry_join { 
                leader_api_addr = "https://vault-6.vault-internal:8200"
                leader_ca_cert_file = "/vault/userconfig/vault-ha-tls/vault.ca"
                leader_client_cert_file = "/vault/userconfig/vault-ha-tls/vault.crt"
                leader_client_key_file = "/vault/userconfig/vault-ha-tls/vault.key"
               }
            }
            seal "awskms" {
               region = "eu-west-2"
               kms_key_id = "your-kms-key-id"
               }
            # seal "gcpckms" {
            #   project     = "vault-helm-dev-246514"
            #   region      = "global"
            #   key_ring    = "vault-helm-unseal-kr"
            #   crypto_key  = "vault-helm-unseal-key"
            #        }  
            # seal "transit" {  
            #    address = "https://do-not-delete-ever-v2-public-vault-cf6a1d76.5773df81.z1.hashicorp.cloud:8200"
            #    namespace = "admin/"
            #    token = "hvs.CAESIE1LvBXW6iIXQD3Q6LdGxD5fFVBEnGSqP4hvmwfx1Bl1GikKImh2cy5GMjZDSFJraXlrTnlBVFRua2RqYU9rUWYuOEJ5SnAQiJaFAw"
            #    disable_renewal = "false"
            #    key_name = "autounseal"
            #    mount_path = "minikube_vault_autounseal/"
            #    tls_skip_verify = "true"
            # }
            disable_mlock = true
            service_registration "kubernetes" {}
#Ingress
ingress:
   enabled: true
   hosts:
      - host: localhost
# Vault UI
ui:
  enabled: true
  publishNotReadyAddresses: true
  activeVaultPodOnly: false
  serviceType: LoadBalancer
  externalPort: 8200
  targetPort: 8200
  